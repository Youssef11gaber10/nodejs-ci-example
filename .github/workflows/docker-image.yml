name: Docker Image CI

on:
  push:
    branches: [ "main" ]


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4 # thsi for pull code from repo 

    - name: Build Docker image
      run: |
        docker build . \
        --file Dockerfile \
        --tag ${{ vars.DOCKER_USERNAME }}/jenkins-nodeapp:v3

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ vars.DOCKER_USERNAME }}" \
        --password-stdin

    - name: Push image
      run: |
        docker push ${{ vars.DOCKER_USERNAME }}/jenkins-nodeapp:v3

