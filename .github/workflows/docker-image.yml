name: Gaboor workflow

on:
  push:
    branches: [ "main" ]


jobs:

  build:

    runs-on: self-hosted

    steps:

    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build . \
        --file Dockerfile \
        --tag ${{ vars.DOCKER_USERNAME }}/jenkins-nodeapp:v3

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
        --username "${{ vars.DOCKER_USERNAME }}" \
        --password-stdin

    - name: Push Docker image
      run: |
        docker push ${{ vars.DOCKER_USERNAME }}/jenkins-nodeapp:v3

